apiVersion: v2
name: radar-hub
description: Radar Cloud control plane for self-hosted deployments — Go API + React web app + Postgres (bundled eval DB or bring-your-own).
type: application
version: 1.3.0
# appVersion held at 1.2.1 (existing images) so the CI install test passes.
# Bump to the TLS-capable image version at RELEASE time, once radar-hub +
# radar-hub-web are tagged with the :8443 self-signed TLS listener.
appVersion: "1.2.1"
icon: https://radarhq.io/radar/icon-512.png
keywords:
  - radar
  - kubernetes
  - observability
  - self-hosted
  - on-prem
home: https://radarhq.io/docs/cloud/self-hosted
sources:
  - https://github.com/skyhook-dev/radar-hub
maintainers:
  - name: Skyhook
    email: support@skyhook.io
    url: https://radarhq.io
annotations:
  category: monitoring-logging
  artifacthub.io/license: Proprietary
  artifacthub.io/links: |
    - name: Website
      url: https://radarhq.io
    - name: Documentation
      url: https://radarhq.io/docs/cloud/self-hosted
