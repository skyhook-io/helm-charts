# auth.oidc.clusterAccess -> RADAR_HUB_OIDC_CLUSTER_ACCESS. The env name is what
# cmd/hub/main.go reads; a rename on either side renders fine and silently
# leaves every install on the roles default, so the exact string is pinned.
suite: hub deployment OIDC cluster access env
templates:
  - templates/deployment-hub.yaml
  - templates/secret.yaml
tests:
  - it: emits nothing by default
    template: templates/deployment-hub.yaml
    values:
      - values/oidc-base.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADAR_HUB_OIDC_CLUSTER_ACCESS
          any: true

  - it: emits roles when set
    template: templates/deployment-hub.yaml
    values:
      - values/oidc-base.yaml
    set:
      auth.oidc.clusterAccess: roles
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADAR_HUB_OIDC_CLUSTER_ACCESS
            value: "roles"

  - it: emits idp when set
    template: templates/deployment-hub.yaml
    values:
      - values/oidc-base.yaml
    set:
      auth.oidc.clusterAccess: idp
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADAR_HUB_OIDC_CLUSTER_ACCESS
            value: "idp"

  - it: emits nothing without OIDC
    template: templates/deployment-hub.yaml
    values:
      - values/required-base.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADAR_HUB_OIDC_CLUSTER_ACCESS
          any: true

  - it: rejects an unknown value
    template: templates/secret.yaml
    values:
      - values/oidc-base.yaml
    set:
      auth.oidc.clusterAccess: groups
    asserts:
      - failedTemplate:
          errorPattern: "clusterAccess': value must be one of"

  - it: refuses idp without OIDC
    template: templates/secret.yaml
    values:
      - values/required-base.yaml
    set:
      auth.oidc.clusterAccess: idp
    asserts:
      - failedTemplate:
          errorPattern: "needs OIDC configured"

  - it: refuses idp with group passthrough off
    template: templates/secret.yaml
    values:
      - values/oidc-base.yaml
    set:
      auth.oidc.clusterAccess: idp
      auth.oidc.groupsClaim: ""
    asserts:
      - failedTemplate:
          errorPattern: "needs auth.oidc.groupsClaim"

  - it: emits token mode with the Kubernetes prefixes
    template: templates/deployment-hub.yaml
    values:
      - values/oidc-base.yaml
    set:
      auth.oidc.clusterAccess: token
      auth.oidc.useRefreshToken: true
      auth.oidc.k8sUsernamePrefix: "oidc:"
      auth.oidc.k8sGroupsPrefix: "oidc:"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADAR_HUB_OIDC_CLUSTER_ACCESS
            value: "token"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADAR_HUB_OIDC_K8S_USERNAME_PREFIX
            value: "oidc:"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADAR_HUB_OIDC_K8S_GROUPS_PREFIX
            value: "oidc:"

  - it: ignores the Kubernetes prefixes outside token mode
    template: templates/deployment-hub.yaml
    values:
      - values/oidc-base.yaml
    set:
      auth.oidc.k8sUsernamePrefix: "oidc:"
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADAR_HUB_OIDC_K8S_USERNAME_PREFIX
          any: true

  - it: refuses token without refresh tokens
    template: templates/secret.yaml
    values:
      - values/oidc-base.yaml
    set:
      auth.oidc.clusterAccess: token
      auth.oidc.useRefreshToken: false
    asserts:
      - failedTemplate:
          errorPattern: "clusterAccess=token needs auth.oidc.useRefreshToken=true"

  - it: refuses token without OIDC
    template: templates/secret.yaml
    values:
      - values/required-base.yaml
    set:
      auth.oidc.clusterAccess: token
    asserts:
      - failedTemplate:
          errorPattern: "clusterAccess=token needs OIDC configured"

  - it: allows token with a self-signed Hub certificate
    template: templates/secret.yaml
    values:
      - values/oidc-base.yaml
    set:
      auth.oidc.clusterAccess: token
      web.tls.selfSigned: true
    asserts:
      - notFailedTemplate: {}

  - it: refuses token with the local cluster
    template: templates/secret.yaml
    values:
      - values/oidc-base.yaml
    set:
      auth.oidc.clusterAccess: token
      localCluster.id: k3Fg-9pA_x1
      localCluster.existingSecret: lc
    asserts:
      - failedTemplate:
          errorPattern: "can't be used with localCluster"

  - it: allows token behind external TLS with the in-cluster listener kept
    template: templates/secret.yaml
    values:
      - values/oidc-base.yaml
    set:
      auth.oidc.clusterAccess: token
      service.web.type: LoadBalancer
      web.tls.inCluster: true
    asserts:
      - notFailedTemplate: {}

  - it: refuses token with an http Hub URL
    template: templates/secret.yaml
    values:
      - values/oidc-base.yaml
    set:
      auth.oidc.clusterAccess: token
      hub.publicURL: http://radar.test.example
    asserts:
      - failedTemplate:
          errorPattern: "clusterAccess=token needs an https hub.publicURL"

  - it: rejects a reserved Kubernetes groups prefix
    template: templates/secret.yaml
    values:
      - values/oidc-base.yaml
    set:
      auth.oidc.clusterAccess: token
      auth.oidc.k8sGroupsPrefix: "radar:"
    asserts:
      - failedTemplate: {}

  - it: rejects a Kubernetes username prefix with whitespace
    template: templates/secret.yaml
    values:
      - values/oidc-base.yaml
    set:
      auth.oidc.clusterAccess: token
      auth.oidc.k8sUsernamePrefix: "oidc user:"
    asserts:
      - failedTemplate:
          errorPattern: "at '/auth/oidc/k8sUsernamePrefix'"

  - it: rejects a Kubernetes groups prefix with a comma
    template: templates/secret.yaml
    values:
      - values/oidc-base.yaml
    set:
      auth.oidc.clusterAccess: token
      auth.oidc.k8sGroupsPrefix: "a,b:"
    asserts:
      - failedTemplate:
          errorPattern: "at '/auth/oidc/k8sGroupsPrefix'"

  - it: rejects a Kubernetes groups prefix over 128 bytes
    template: templates/secret.yaml
    values:
      - values/oidc-base.yaml
    set:
      auth.oidc.clusterAccess: token
      auth.oidc.k8sGroupsPrefix: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    asserts:
      - failedTemplate:
          errorPattern: "at '/auth/oidc/k8sGroupsPrefix'"

  - it: emits the ID token as the relayed token by default in token mode
    template: templates/deployment-hub.yaml
    values:
      - values/oidc-base.yaml
    set:
      auth.oidc.clusterAccess: token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADAR_HUB_OIDC_CLUSTER_TOKEN
            value: "id_token"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADAR_HUB_OIDC_CLUSTER_TOKEN_AUDIENCE
          any: true

  - it: emits the access token and its audience when set
    template: templates/deployment-hub.yaml
    values:
      - values/oidc-base.yaml
    set:
      auth.oidc.clusterAccess: token
      auth.oidc.clusterToken: access_token
      auth.oidc.clusterTokenAudience: "kubernetes"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADAR_HUB_OIDC_CLUSTER_TOKEN
            value: "access_token"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADAR_HUB_OIDC_CLUSTER_TOKEN_AUDIENCE
            value: "kubernetes"

  - it: ignores the relayed token outside token mode
    template: templates/deployment-hub.yaml
    values:
      - values/oidc-base.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADAR_HUB_OIDC_CLUSTER_TOKEN
          any: true

  - it: refuses the access token without an audience
    template: templates/secret.yaml
    values:
      - values/oidc-base.yaml
    set:
      auth.oidc.clusterAccess: token
      auth.oidc.clusterToken: access_token
    asserts:
      - failedTemplate:
          errorPattern: "clusterToken=access_token needs auth.oidc.clusterTokenAudience"

  - it: refuses the access token outside token mode
    template: templates/secret.yaml
    values:
      - values/oidc-base.yaml
    set:
      auth.oidc.clusterAccess: roles
      auth.oidc.clusterToken: access_token
      auth.oidc.clusterTokenAudience: "kubernetes"
    asserts:
      - failedTemplate:
          errorPattern: "clusterToken=access_token needs auth.oidc.clusterAccess=token"

  - it: rejects an unknown relayed token
    template: templates/secret.yaml
    values:
      - values/oidc-base.yaml
    set:
      auth.oidc.clusterAccess: token
      auth.oidc.clusterToken: refresh_token
    asserts:
      - failedTemplate:
          errorPattern: "clusterToken': value must be one of"

  - it: emits the email claim by default
    template: templates/deployment-hub.yaml
    values:
      - values/oidc-base.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADAR_HUB_OIDC_EMAIL_CLAIM
            value: "email"

  - it: emits a custom email claim
    template: templates/deployment-hub.yaml
    values:
      - values/oidc-base.yaml
    set:
      auth.oidc.emailClaim: upn
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADAR_HUB_OIDC_EMAIL_CLAIM
            value: "upn"

  - it: emits no email claim without OIDC
    template: templates/deployment-hub.yaml
    values:
      - values/required-base.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADAR_HUB_OIDC_EMAIL_CLAIM
          any: true
