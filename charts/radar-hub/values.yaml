# radar-hub Helm chart values.
#
# Self-hosted deployment: API (Go) + web app (nginx-served static) +
# Postgres. Database migrations run automatically via an initContainer on
# the hub Deployment before the main container starts. By default the chart
# ships an in-cluster Postgres for EVALUATION (postgres.bundled); for
# production, disable it and point at your own DB (postgres.external).
#
# Required values for a working install:
#   --set hub.publicURL=https://radar.acme.example
#   --set hub.cookiePassword=<32+ byte secret>
#   # Postgres: bundled eval DB is ON by default (nothing to set). For
#   # production: --set postgres.bundled.enabled=false --set postgres.external.existingSecret=<secret>
#   --set auth.breakGlass.email=admin@acme.example
#   --set auth.breakGlass.password=<changeme>   (OR passwordHash)
#
# The license is OPTIONAL at install time: without one the hub starts up but
# the web UI is gated on a license-required screen. Set license.key (below)
# and redeploy to activate.
#   --set license.key=<JWT>
#
# OIDC and ingress are optional but typical.

# ---------------------------------------------------------------------------
# Images
# ---------------------------------------------------------------------------
image:
  hub:
    repository: ghcr.io/skyhook-dev/radar-hub
    tag: ""           # defaults to chart appVersion when empty
    pullPolicy: IfNotPresent
  web:
    repository: ghcr.io/skyhook-dev/radar-hub-web
    tag: ""           # defaults to chart appVersion when empty
    pullPolicy: IfNotPresent
  # Per-turn sandbox image for AI agent (hub.agent). Only pulled when
  # hub.agent.enabled=true. Version-locked to the hub image: the turn
  # contract, the sessions RPC and the DB transport table are all hub-side, so
  # this tag tracks appVersion and should not be pinned independently.
  # No pullPolicy knob — the hub hardcodes PullIfNotPresent on the Job spec,
  # which is why the tag must be an immutable version, never a moving one.
  agentSandbox:
    repository: ghcr.io/skyhook-dev/radar-hub-ai-agent-sandbox
    tag: ""           # defaults to chart appVersion when empty
imagePullSecrets: []

# ---------------------------------------------------------------------------
# License (Skyhook-issued JWT) — OPTIONAL
# ---------------------------------------------------------------------------
# Leave both empty to install without a license: the hub boots and the web UI
# shows a license-required screen until you set one and redeploy.
#
# To activate, EITHER set license.key directly OR point at an existing Secret
# with key `license`. Setting both fails the install with a clear error — the
# deployment Pod reads via `default chartSecret existingSecret`, so an
# existingSecret would silently win and the inline value would be ignored.
# existingSecret is preferred for production so the JWT isn't in plaintext in
# your values file.
license:
  key: ""
  existingSecret: ""

# ---------------------------------------------------------------------------
# Postgres — set EXACTLY ONE of `bundled` / `external`
# ---------------------------------------------------------------------------
#   * bundled  → the chart ships an in-cluster Postgres. EVALUATION ONLY:
#                single instance, no HA, no backups. Default ON so a bare
#                `helm install` gives a working eval stack.
#   * external → bring your own Postgres (managed SaaS, self-run, or a
#                CloudNativePG cluster). The production path.
# The render fails if both resolve, or if neither does.
postgres:
  bundled:
    # Default ON: a bare install stands up an eval stack. For production, set
    # this false and configure `external`.
    enabled: true
    # Docker Official Image. Override to a hardened/mirrored image if needed.
    image: postgres:17-alpine
    auth:
      database: radar_hub
      username: radar_hub
      # Set once at FIRST install. Leave empty to generate a password and
      # persist it across `helm upgrade`. Changing it later does NOT rotate the
      # DB (delete the PVC to reset) — eval only. For GitOps/declarative installs
      # (Argo/Flux), set this explicitly rather than relying on generation.
      password: ""
    persistence:
      size: 10Gi
      storageClass: ""          # cluster default when empty
    # Eval DB defaults. Requests keep it Burstable (guaranteed schedule) instead
    # of BestEffort. Memory limit is 512Mi, not 256Mi: postgres:17-alpine
    # (shared_buffers ~128Mi + WAL + connections) OOMKills under a 256Mi hard cap.
    # Override for heavier eval loads; production uses `external` anyway.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1
        memory: 512Mi

  external:
    # Secret holding the connection string (single key). Managed SaaS
    # (RDS / Cloud SQL / Neon), a self-run Postgres, or a CloudNativePG
    # cluster. For managed Postgres that authenticates via a proxy/IAM
    # (Cloud SQL Auth Proxy, RDS IAM), run the proxy alongside the hub and
    # point the DSN at localhost. The chart does not inject sidecars; add one
    # via your own overlay (kustomize/patch).
    existingSecret: ""
    # Key inside the Secret. Empty → "dsn" for existingSecret, "uri" for a
    # CloudNativePG <cluster>-app Secret.
    secretKey: ""
    # Convenience for CloudNativePG: reads the "<cluster>-app" Secret
    # (CNPG's generated app Secret) with key "uri". We do NOT deploy
    # CNPG or its operator — you already operate the Cluster; the chart only
    # reads its connection Secret. Must be in the SAME namespace as this release.
    cnpgCluster: ""

# ---------------------------------------------------------------------------
# Hub configuration
# ---------------------------------------------------------------------------
hub:
  # Public URL the web app + agent connect to. Must include scheme + host.
  #
  # MUST be https://. An http:// URL installs cleanly and passes readiness, but
  # nothing can sign in and no cluster can connect:
  #   - the OIDC state cookie is __Host- prefixed, so it carries Secure and is
  #     never sent back over plain HTTP. Sign-in bounces to
  #     /login?error=session_expired and the hub logs "state cookie missing".
  #   - in-cluster Radar refuses a ws:// tunnel to any non-loopback host.
  # Terminate TLS at your Ingress, or set web.tls.selfSigned=true for a trial
  # (pair it with cloud.insecureSkipVerify=true on the agent).
  publicURL: ""

  # Cookie sealing key — 32+ bytes. Generate with `openssl rand -base64 48`.
  cookiePassword: ""
  cookiePasswordExistingSecret: ""   # Secret with key `cookie-password`.

  # -------------------------------------------------------------------------
  # AI agent (optional, OFF by default)
  # -------------------------------------------------------------------------
  # Each investigation turn runs as a short-lived, network-restricted k8s Job in
  # its own namespace. The pod has no mounted ServiceAccount token; it reads
  # the cluster over the hub's MCP tunnel and reaches the model through a
  # sidecar broker that attaches the API key. Only the sidecar container
  # receives that key, not the agent container.
  #
  # Enabling this creates, in the sandbox namespace: the Namespace, a Secret
  # holding the model key + the pod-reachable DSN, a NetworkPolicy pinning
  # egress, and a Role/RoleBinding letting the hub's ServiceAccount manage Jobs
  # there. Nothing is created when enabled=false.
  agent:
    enabled: false

    # Which model provider the sidecar broker forwards to.
    #   anthropic → api.anthropic.com with an Anthropic API key (sk-ant-…).
    #               Works from any cloud; no AWS account needed.
    #   bedrock   → bedrock-runtime.<region>.amazonaws.com with an IAM
    #               service-specific credential for bedrock.amazonaws.com.
    #   vertex    → Claude on Google Cloud Vertex AI with a GCP service-account
    #               key (JSON). Needs a Hub release with Vertex support.
    # Only the selected provider's broker is mounted in the pod and only its
    # credential is injected, so the other egress path does not exist there.
    provider: anthropic

    # Human-facing engine name shown on the investigation panel (e.g.
    # "Claude (via Agent SDK)"). Empty hides the chip.
    engineLabel: ""

    # Let alert rules attach an AI analysis to the issues they match
    # (HUB_AGENT_BACKGROUND_ENABLED on the hub). This is only the fleet-wide
    # kill switch: an issue is analysed solely when the organization's owner
    # has consented, an alert rule covering it opted in, and the engine above
    # is on. It rides the alerts worker, so it does nothing in a process
    # running with the worker disabled.
    alertAnalysis: false

    # Credentials reaching the Job pod. Every one is delivered by SecretKeyRef;
    # there is no by-value path into the Job object.
    credentials:
      # Point at a Secret you manage (sealed-secrets, external-secrets, SOPS).
      # It MUST live in the sandbox namespace below and carry:
      #   HUB_AGENT_DB_DSN                 (always)
      #   HUB_AGENT_ANTHROPIC_API_KEY      (provider: anthropic)
      #   HUB_AGENT_BEDROCK_API_KEY        (provider: bedrock)
      #   HUB_AGENT_VERTEX_CREDENTIALS     (provider: vertex; the SA key JSON)
      # Set this OR the inline values below — not both.
      existingSecret: ""

      # Model API key. Written under the key matching `provider`, so flipping
      # provider is one value change and the unselected provider's key never
      # exists in the cluster.
      apiKey: ""

      # GCP service-account key, as the JSON document. Read only under
      # provider: vertex, where it replaces apiKey. The account needs
      # roles/aiplatform.user (or an equivalent) on vertex.project.
      serviceAccountJSON: ""

      # DSN the SANDBOX POD resolves — not the one the hub uses. Leave empty
      # with the bundled eval Postgres and the chart derives the cross-namespace
      # FQDN form (this needs postgres.bundled.auth.password set explicitly;
      # a generated password cannot be read back at render time). With an
      # external database, set this or credentials.existingSecret — the chart
      # cannot read the contents of your Postgres Secret to rewrite the host.
      podDSN: ""

    # Anthropic first-party API. Read only under provider: anthropic.
    anthropic:
      # Bare model id — NOT the us.anthropic.* inference-profile form.
      model: "claude-sonnet-4-6"

    # Amazon Bedrock. Read only under provider: bedrock.
    bedrock:
      region: "us-east-1"
      # Inference-profile id, not the bare model id.
      model: "us.anthropic.claude-sonnet-4-6"

    # Claude on Google Cloud Vertex AI. Read only under provider: vertex.
    vertex:
      # GCP project id the model is invoked in. Required; there is no default.
      project: ""
      # global (recommended — widest model availability), us, eu, or a region
      # such as us-east5.
      location: "global"
      # Bare model id, same form as anthropic.model (dated snapshots use `@`).
      model: "claude-sonnet-4-6"

    sandbox:
      # Namespace the per-turn Jobs land in. Empty → "<fullname>-sandbox", which
      # is release-scoped so two installs in one cluster cannot collide and a
      # bare install cannot adopt an unrelated namespace that already exists.
      namespace: ""
      # Create the Namespace as part of the release. Set false to run the Jobs
      # in a namespace you already manage — the Role, RoleBinding, Secret and
      # NetworkPolicy are still rendered into it. Helm refuses to install over
      # an existing namespace it does not own, so a name collision fails the
      # install rather than silently taking it over.
      create: true

      networkPolicy:
        # The Job pods ingest untrusted cluster logs and events, so egress is
        # allowed for DNS, outbound HTTPS on port 443, the hub, and Postgres.
        # HTTPS is not limited to model-provider destinations; tighter control
        # needs an egress proxy or CNI-specific policy. Enforcement is
        # CNI-dependent — use a CNI with NetworkPolicy enforcement enabled.
        # kindnet does NOT enforce it. Ingress is denied outright.
        enabled: true
        # Port the sandbox reaches Postgres on. Change it if your database
        # listens elsewhere (e.g. a pooler on 6432).
        postgresPort: 5432
        # Extra egress rules appended verbatim, in the NetworkPolicy shape.
        # Needed for a database behind a non-standard port, an egress proxy, or
        # a private model endpoint.
        extraEgress: []

  # Display name + retention.
  orgName: "Default"
  auditRetentionDays: 365

  # -------------------------------------------------------------------------
  # Air-gapped installs: no outbound connections at all
  # -------------------------------------------------------------------------
  # Set this true for a deployment that must not talk to anything outside your
  # network. It is NOT cosmetic — it turns off the two things this hub does on
  # its own initiative:
  #
  #   * the hourly check to api.github.com for the latest Radar version
  #     (pin `latestRadarVersion` below if you still want the UI to show one)
  #   * the daily license renewal call to Radar Cloud
  #
  # An air-gapped license is issued by hand and installed as license.key, so
  # there is nothing for the hub to renew and nobody for it to ask. Leaving
  # this false on an isolated network does not break the hub — the calls simply
  # fail and are logged — but it does mean the deployment is attempting egress,
  # which is usually the thing an air-gapped install is audited on.
  #
  # Needs a hub image that enforces it. If you
  # pin image.hub.tag to something older, the render fails rather than
  # installing a hub that ignores this and keeps calling out.
  #
  # REQUIRES A LICENSE THAT PERMITS IT. Air-gapped operation is part of a
  # Custom contract; Enterprise buys self-hosting, which is the same product
  # renewing its license once a day. Setting this with an Enterprise license
  # makes the hub refuse to start, naming the reason — the chart cannot check
  # it here, because the permission is a signed claim inside the license and
  # verifying a signature is not something Helm templating can do.
  airGapped: false

  # What the UI reports as the latest available Radar version.
  #
  # Empty means the hub asks GitHub hourly. Pin it (e.g. "1.10.0") to answer
  # from this value instead and make no such call — required for an air-gapped
  # install to be honest about making no outbound connections, and useful for
  # anyone who mirrors releases internally on their own schedule.
  latestRadarVersion: ""


  # Where the hub asks for a renewed license. Cloud-managed installs only, and
  # the default is correct for every customer — override only if Skyhook has
  # given you a different endpoint. Ignored entirely when airGapped is true.
  licenseServer: ""

  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi

  podAnnotations: {}
  # Official images are published for linux/amd64 and linux/arm64, so only the
  # OS is pinned by default. Add kubernetes.io/arch: <amd64|arm64> to constrain
  # it; Helm merges that key with this default selector.
  nodeSelector:
    kubernetes.io/os: linux
  tolerations: []
  affinity: {}

  # Probes hit /healthz on the hub. Adjust if you've fronted the hub with
  # a different liveness contract.
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 30
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10

# ---------------------------------------------------------------------------
# Web app — nginx serves the prebuilt static bundle and reverse-proxies
# /api + /agent to the hub Service.
# ---------------------------------------------------------------------------
web:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  podAnnotations: {}
  # Official images are published for linux/amd64 and linux/arm64, so only the
  # OS is pinned by default. Add kubernetes.io/arch: <amd64|arm64> to constrain
  # it; Helm merges that key with this default selector.
  nodeSelector:
    kubernetes.io/os: linux
  tolerations: []
  affinity: {}
  # Self-hosted TRIAL only: serve a self-signed cert on the web pod's :8443 so a
  # LoadBalancer-exposed hub has an https/wss endpoint without cert-manager/ACM.
  # The Radar connector must set cloud.insecureSkipVerify=true (encrypted, not
  # authenticated). Leave false and terminate TLS at an Ingress (cert-manager)
  # for a browser-trusted certificate.
  tls:
    selfSigned: false

# ---------------------------------------------------------------------------
# Auth
# ---------------------------------------------------------------------------
auth:
  # Always-available bootstrap admin. Permanent, not a stopgap. Ship the
  # bcrypt hash via passwordHash (or passwordHashExistingSecret) for
  # production; plaintext password is hashed at boot and discarded.
  breakGlass:
    email: ""
    password: ""
    passwordHash: ""
    passwordHashExistingSecret: ""   # Secret with key `password-hash`.

  # OIDC federated login. Leaving issuer empty disables OIDC entirely;
  # break-glass admin remains available for bootstrap.
  oidc:
    issuer: ""           # https://acme.okta.com (no trailing /.well-known/...)
    clientID: ""
    clientSecret: ""
    clientSecretExistingSecret: ""   # Secret with key `client-secret`.
    callbackURL: ""      # <hub.publicURL>/api/auth/oidc/callback
    # Role given to new OIDC users on first sign-in (owner | member | viewer).
    # Roles are managed in the hub by an owner afterwards; they are not synced
    # from IdP groups.
    defaultRole: "member"
    # Name of the ID-token claim holding the user's IdP groups. Defaults to
    # "groups", which is what Okta, Keycloak and Entra emit. Set it empty to
    # disable group passthrough entirely.
    #
    # A claim your IdP does not emit is harmless: no groups are forwarded and
    # sign-in is unaffected. Nothing reaches a cluster until you write a
    # RoleBinding naming one of the subjects below.
    #
    # Each group value is forwarded to your connected clusters as a
    # `radar:idp:<group>` subject, so you can bind Kubernetes RBAC to the groups
    # you already manage in your IdP instead of re-authoring per-user bindings:
    #
    #   subjects:
    #     - kind: Group
    #       name: radar:idp:<group-value-exactly-as-your-IdP-emits-it>
    #       apiGroup: rbac.authorization.k8s.io
    #
    # Claim name varies by IdP: "groups" for Okta, Keycloak and Entra; ADFS
    # commonly uses "group" or a URI-style claim type such as
    # "http://schemas.xmlsoap.org/claims/Group".
    #
    # A groups claim may be an array or a single string. A string is ONE
    # group, not a list to split: providers emit a string when the user is in
    # exactly one group (ADFS does this), so splitting would invent groups.
    # An AD distinguished name is therefore one value containing commas, and
    # is dropped by the rule below rather than broken into parts.
    #
    # Group VALUES that cannot be represented verbatim in the forwarded header
    # are DROPPED rather than escaped, because a value that can't round-trip
    # can't be bound accurately in RBAC either. A value is forwarded only if it
    # is printable ASCII with no whitespace and no comma, and at most 128 bytes
    # measured on the value AS THE IdP EMITS IT — a provider prefix counts, so
    # a Keycloak group (which arrives as "/name") has 127. At most 64 groups
    # are forwarded per user. This matters for Active Directory: display names
    # like "Domain Admins" contain a space and are dropped. Emit stable group IDs (Entra object IDs, Okta group IDs) rather
    # than display names — they are also immune to a group being renamed, which
    # would otherwise silently repoint or break every binding.
    #
    # Requires a Hub image that understands RADAR_HUB_OIDC_GROUP_CLAIM. On an
    # older Hub the variable is ignored and no group subjects reach clusters.
    #
    # This does not change what is requested from your IdP, so it cannot
    # affect sign-in or token size: it only decides whether the groups already
    # present in the ID token are read and forwarded. In particular it does NOT
    # change the scopes requested — see `scopes` below.
    #
    # This does NOT affect hub roles. Roles stay hub-authoritative (defaultRole
    # above, then managed by an owner in the hub).
    groupsClaim: "groups"
    # Extra OIDC scopes on top of openid+email. Setting groupsClaim above does
    # NOT add a scope, because providers differ in how they are asked for
    # groups and guessing breaks logins:
    #   Okta      -> gates the claim behind a scope on a CUSTOM authorization
    #                server: add "groups" only if your server defines it.
    #   Keycloak  -> depends on where the group-membership mapper sits. On the
    #                client's DEDICATED scope the claim is always present:
    #                leave this empty. On an OPTIONAL client scope named
    #                "groups": add "groups".
    #   Entra ID  -> emits groups from the app's Token configuration and
    #                REJECTS an unknown "groups" scope (AADSTS70011). Leave empty.
    #   Google    -> emits no groups and rejects the scope. Leave empty.
    #
    # Asking for a scope the provider does not define does NOT merely omit the
    # groups — it fails the whole sign-in (Keycloak: "invalid_scope"). When in
    # doubt leave this empty and check whether groups arrive before adding one.
    scopes: []
    # Keep the IdP refresh token on the session and refresh the ID token before
    # it expires. IdP groups then stay current for the whole session instead of
    # being dropped when the first ID token expires (typically an hour), and a
    # user the IdP rejects on refresh is signed out.
    #
    # Does NOT change the scopes requested. Okta and Entra return a refresh
    # token only when "offline_access" is in `scopes` above; Keycloak returns
    # one by default. The IdP client needs the Refresh Token grant.
    #
    # An unreachable IdP (or 429/5xx) fails the request with 503 and keeps the
    # session; an IdP that rejects the refresh token ends the session (401).
    #
    # Requires Hub 1.6.0 or newer; an older Hub ignores it.
    useRefreshToken: false
    # How NEW cluster installs grant Kubernetes access to hub users.
    #   roles -> the Radar chart's default ClusterRoleBindings for hub roles
    #            (owner/member/viewer) stay on. The default.
    #   idp   -> the connect wizard installs with cloud.defaultRbac.create=false,
    #            so hub roles grant nothing in the cluster and your own
    #            RoleBindings on radar:idp:<group> subjects decide access.
    #
    # Existing clusters are never changed. The Hub shows this read-only in
    # Settings; it cannot be changed from the UI on a self-hosted install.
    #
    # idp needs IdP group passthrough (groupsClaim above) to be working —
    # otherwise new clusters get no hub-role bindings AND no group subjects,
    # and nobody can see anything. The Hub logs a warning at boot in that case.
    #
    # An older Hub ignores this value and behaves as roles.
    clusterAccess: "roles"

  # Server-side session limits for OIDC and break-glass sign-ins. Sessions live
  # in Postgres; the cookie carries only a random session id, so signing out,
  # removing a member, or rotating the break-glass password ends the session
  # server-side. Empty = the Hub default. Go duration syntax: "168h", "30m"
  # ("7d" is NOT valid and is rejected by the schema).
  #
  # Requires Hub 1.6.0 or newer; an older Hub ignores both.
  session:
    # Absolute lifetime from sign-in. Hub default: 168h (7 days).
    maxLifetime: ""
    # A session unused for this long is signed out. Hub default: 24h. Must be
    # at least 20m, or the Hub refuses to start.
    maxInactive: ""

# ---------------------------------------------------------------------------
# Branding (customer-facing strings exposed via /api/config)
# ---------------------------------------------------------------------------
branding:
  # Displayed wordmark in the web app sidebar + page titles. Default "Radar"
  # matches the OSS product name; partners under EULA terms may not
  # remove the "Powered by Radar" footer but can override the primary
  # wordmark to their own brand.
  brandName: "Radar"
  docsURL: "https://radarhq.io/docs"
  supportEmail: "support@radarhq.io"
  feedbackEmail: "feedback@radarhq.io"

# ---------------------------------------------------------------------------
# Networking — expose the hub via traditional Ingress OR Gateway API.
# Enable AT MOST ONE (the render fails if both are enabled). Public traffic
# terminates on the web Service, whose nginx proxies /api, /agent, /mcp to the
# hub Service in-cluster.
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""            # IngressClass name, e.g. nginx
  annotations: {}          # cert-manager, nginx tuning, etc.
  # One or more hosts, each with its paths. Host derives from hub.publicURL.
  hosts: []
    # - host: radar.acme.example
    #   paths:
    #     - path: /
    #       pathType: Prefix
  # TLS blocks in the native Ingress shape. Each entry needs a secretName.
  tls: []
    # - secretName: radar-hub-tls
    #   hosts: [radar.acme.example]

# Gateway API HTTPRoute (Istio, Envoy Gateway, Cilium, etc.). Mutually exclusive
# with ingress. The Gateway (and its TLS listener) is managed outside this
# chart; the route just attaches to it.
httpRoute:
  enabled: false
  # HTTPRoute API version. Override for clusters on an older Gateway API, e.g.
  # gateway.networking.k8s.io/v1beta1.
  apiVersion: gateway.networking.k8s.io/v1
  annotations: {}
  labels: {}
  parentRefs: []
    # - name: my-gateway
    #   namespace: gateway-system
    #   sectionName: https
  hostnames: []            # [radar.acme.example]
  # Optional request timeout for the chart-generated default rule. Empty means
  # the Gateway's own default applies. Set "0s" to explicitly disable it.
  defaultTimeout: ""
  # When empty, the chart emits a single "/" PathPrefix rule to the web Service.
  # Non-empty rules replace that default and pass through unchanged — multiple
  # path prefixes, per-route timeouts, filters, or alternate backends.
  rules: []

# ---------------------------------------------------------------------------
# Service
# ---------------------------------------------------------------------------
service:
  # Public traffic should normally terminate on the web Service. The web
  # container's nginx proxies /api, /agent, /mcp, and /c/{id}/{api,mcp}
  # to the hub Service in-cluster.
  web:
    type: ClusterIP
    port: 80
    # HTTPS port on the web Service, wired to the pod's self-signed :8443
    # listener. Only rendered when web.tls.selfSigned=true.
    tlsPort: 443

  # Advanced/split-origin only. Keep the hub Service internal unless you
  # intentionally expose the raw hub API separately from the web frontend.
  hub:
    type: ClusterIP
    port: 8080

# ---------------------------------------------------------------------------
# ServiceAccount + RBAC
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  # Annotations attached to the chart-managed ServiceAccount. Most
  # customers use this to wire cloud-provider workload identity, e.g.
  #   eks.amazonaws.com/role-arn:  arn:aws:iam::...:role/radar-hub
  #   iam.gke.io/gcp-service-account: radar-hub@<project>.iam.gserviceaccount.com
  annotations: {}

# ---------------------------------------------------------------------------
# Cluster domain
# ---------------------------------------------------------------------------
# Used to build the in-cluster FQDN for HUB_UPSTREAM (the web container's
# nginx proxies to it). `cluster.local` is the default on every standard
# K8s cluster but multi-cluster mesh setups (GKE Anthos, custom kubeadm)
# may use a different domain. Override if `kubectl exec` into a pod
# shows a different `search ... svc.<domain>` line in /etc/resolv.conf.
clusterDomain: cluster.local

# ---------------------------------------------------------------------------
# Pod security
# ---------------------------------------------------------------------------
# Defaults satisfy Pod Security Admission `restricted` (the default in
# many enterprise envs). Notably we DO NOT pin runAsUser/runAsGroup —
# the hub image runs as distroless `nonroot` (UID 65532), the web image
# runs as nginx-unprivileged (UID 101). Pinning either at the pod level
# would break the other container, so we leave it to each image's USER
# directive and only enforce `runAsNonRoot: true` at the pod level.
#
# Per-container securityContext override knobs (.Values.hub/web.securityContext)
# are not surfaced yet; customers needing strict per-container UIDs would need
# them added.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: false  # web image needs writable /var/cache/nginx + /tmp/run

# ---------------------------------------------------------------------------
# Names
# ---------------------------------------------------------------------------
nameOverride: ""
fullnameOverride: ""
