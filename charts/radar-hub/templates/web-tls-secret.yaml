{{- /* Certificate for the web pod's self-signed https listener. Rendered only
       when that listener is on and web.tls.existingSecret is empty. It holds
       web.tls.certificate and web.tls.privateKey when set, else a generated
       certificate; that Secret is kept on uninstall so clusters and
       workstations that trust the certificate keep it. See radar-hub.webTLSCert. */}}
{{- if and (include "radar-hub.inClusterTLS" .) (not .Values.web.tls.existingSecret) }}
{{- $cert := include "radar-hub.webTLSCert" . | fromJson }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "radar-hub.webTLSSecretName" . }}
  labels:
    {{- include "radar-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  {{- if $cert.generated }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.crt }}
  tls.key: {{ $cert.key }}
{{- end }}
