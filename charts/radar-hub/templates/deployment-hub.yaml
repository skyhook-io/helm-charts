apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "radar-hub.hubName" . }}
  labels:
    {{- include "radar-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
spec:
  replicas: {{ .Values.hub.replicas }}
  selector:
    matchLabels:
      {{- include "radar-hub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: hub
  template:
    metadata:
      annotations:
        {{- /* Roll the pod when the chart-managed Secret changes (license,
               cookie password, OIDC client secret, break-glass creds). */}}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.hub.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "radar-hub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: hub
    spec:
      serviceAccountName: {{ include "radar-hub.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if .Values.postgres.bundled.enabled }}
        # Bundled Postgres starts alongside this Pod; block migrate until it
        # accepts connections so the initContainer doesn't crash-loop while the
        # StatefulSet comes up. Only present in bundled mode — an external DB is
        # assumed already reachable.
        - name: wait-for-db
          image: {{ .Values.postgres.bundled.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          command:
            - sh
            - -c
            - >-
              until pg_isready -h {{ include "radar-hub.bundledPostgresName" . }} -p 5432
              -U {{ .Values.postgres.bundled.auth.username | quote }};
              do echo "waiting for postgres..."; sleep 2; done
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
        {{- end }}
        # cmd/migrate applies any pending schema migrations against the
        # customer's Postgres before the hub starts. Replaces the previous
        # Helm pre-install hook pattern: hooks fire BEFORE non-hook
        # resources install, so the chart-managed Secret + ServiceAccount
        # don't exist yet when the Job pod tries to mount them. An
        # initContainer runs in the same Pod as the main hub container,
        # mounts the same Secret refs, and blocks the main container until
        # migrations complete. Multi-replica safe via schema_migrations.
        - name: migrate
          image: {{ include "radar-hub.hubImage" . }}
          imagePullPolicy: {{ .Values.image.hub.pullPolicy }}
          securityContext:
            # runAsUser is pinned to 65532 (distroless's `nonroot`) because
            # the image's USER directive uses the name, not a numeric UID
            # — and `runAsNonRoot: true` requires a numeric UID to verify.
            # The web container uses its own (UID 101) via the image's
            # numeric USER directive.
            runAsUser: 65532
            runAsGroup: 65532
            {{- with .Values.securityContext }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          command: ["/migrate"]
          env:
            - name: HUB_DB_DSN
              valueFrom:
                secretKeyRef:
                  {{- include "radar-hub.postgresSecretRef" . | nindent 18 }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      containers:
        - name: hub
          image: {{ include "radar-hub.hubImage" . }}
          imagePullPolicy: {{ .Values.image.hub.pullPolicy }}
          securityContext:
            # runAsUser is pinned to 65532 (distroless's `nonroot`) because
            # the image's USER directive uses the name, not a numeric UID
            # — and `runAsNonRoot: true` requires a numeric UID to verify.
            # The web container uses its own (UID 101) via the image's
            # numeric USER directive.
            runAsUser: 65532
            runAsGroup: 65532
            {{- with .Values.securityContext }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          command: ["/hub"]
          args:
            - "-addr=:8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: RADAR_HUB_MODE
              value: "self_hosted"
            - name: RADAR_HUB_VERSION
              value: {{ default .Chart.AppVersion .Values.image.hub.tag | quote }}
            # Deployment identity (namespace + Helm release name) via the downward
            # API. The hub reflects these as non-secret facts on GET /api/config
            # in self-hosted mode.
            - name: RADAR_HUB_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RADAR_HUB_RELEASE_NAME
              value: {{ .Release.Name | quote }}
            {{- /* Air-gapped: the two calls the hub makes on its own
                   initiative are the version poll and the license renewal.
                   Pinning the version answers the first from config instead of
                   from api.github.com; an empty license server stops the
                   second. Without this the chart offered no way to turn either
                   off, so "makes no outbound connections" was not true of any
                   install that could be sold on it (S52). */}}
            {{- if .Values.hub.latestRadarVersion }}
            - name: HUB_LATEST_RADAR_VERSION
              value: {{ .Values.hub.latestRadarVersion | quote }}
            {{- end }}
            {{- if not .Values.hub.airGapped }}
            {{- if .Values.hub.licenseServer }}
            - name: RADAR_HUB_LICENSE_SERVER
              value: {{ .Values.hub.licenseServer | quote }}
            {{- end }}
            {{- else }}
            - name: RADAR_HUB_AIR_GAPPED
              value: "true"
            {{- end }}
            - name: RADAR_HUB_CHART_VERSION
              value: {{ .Chart.Version | quote }}
            {{- if .Values.web.tls.selfSigned }}
            # Self-signed TLS (LoadBalancer trial path): the hub reflects this on
            # GET /api/config so the connect wizard adds cloud.insecureSkipVerify=true
            # to the generated cluster install command — a connector dialing this
            # hub over wss:// must skip verification of the self-signed cert.
            - name: RADAR_HUB_INSECURE_SKIP_VERIFY
              value: "true"
            {{- end }}
            - name: RADAR_HUB_ORG_NAME
              value: {{ .Values.hub.orgName | quote }}
            - name: RADAR_HUB_AUDIT_RETENTION_DAYS
              value: {{ .Values.hub.auditRetentionDays | quote }}
            - name: RADAR_HUB_BRAND_NAME
              value: {{ .Values.branding.brandName | quote }}
            - name: RADAR_HUB_BRAND_DOCS_URL
              value: {{ .Values.branding.docsURL | quote }}
            - name: RADAR_HUB_BRAND_SUPPORT_EMAIL
              value: {{ .Values.branding.supportEmail | quote }}
            - name: RADAR_HUB_BRAND_FEEDBACK_EMAIL
              value: {{ .Values.branding.feedbackEmail | quote }}
            - name: RADAR_HUB_PUBLIC_URL
              value: {{ .Values.hub.publicURL | quote }}
            - name: HUB_FRONTEND_URL
              value: {{ .Values.hub.publicURL | quote }}
            - name: HUB_ALLOWED_ORIGINS
              value: {{ .Values.hub.publicURL | quote }}
            - name: HUB_DB_DSN
              valueFrom:
                secretKeyRef:
                  {{- include "radar-hub.postgresSecretRef" . | nindent 18 }}
            - name: HUB_COOKIE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "radar-hub.secretName" .) .Values.hub.cookiePasswordExistingSecret | quote }}
                  key: cookie-password
            {{- /* License is optional. When unset, nothing is mounted, the
                   hub boots in a blocked state, and the web UI shows the
                   license-required screen.

                   MOUNTED AS A FILE, not passed as an env var. An env var is
                   fixed for the life of a process, so rotating the JWT inside
                   an existingSecret — the path this chart recommends — changed
                   nothing until somebody deleted the pod, and the deployment
                   checksum below only covers the Secret the CHART renders. A
                   mounted Secret is updated in place by the kubelet, and the
                   hub re-reads this path, so replacing a license takes effect
                   on its own. That matters most for air-gapped installs, which
                   have no other mechanism. */}}

            {{- if .Values.auth.breakGlass.email }}
            - name: RADAR_HUB_BOOTSTRAP_ADMIN_EMAIL
              value: {{ .Values.auth.breakGlass.email | quote }}
            {{- if .Values.auth.breakGlass.passwordHashExistingSecret }}
            - name: RADAR_HUB_BOOTSTRAP_ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.breakGlass.passwordHashExistingSecret | quote }}
                  key: password-hash
            {{- else if .Values.auth.breakGlass.passwordHash }}
            - name: RADAR_HUB_BOOTSTRAP_ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ include "radar-hub.secretName" . | quote }}
                  key: break-glass-password-hash
            {{- else if .Values.auth.breakGlass.password }}
            - name: RADAR_HUB_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "radar-hub.secretName" . | quote }}
                  key: break-glass-password
            {{- end }}
            {{- end }}

            {{- if .Values.auth.oidc.issuer }}
            - name: RADAR_HUB_OIDC_ISSUER
              value: {{ .Values.auth.oidc.issuer | quote }}
            - name: RADAR_HUB_OIDC_CLIENT_ID
              value: {{ .Values.auth.oidc.clientID | quote }}
            - name: RADAR_HUB_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "radar-hub.secretName" .) .Values.auth.oidc.clientSecretExistingSecret | quote }}
                  key: {{ ternary "client-secret" "oidc-client-secret" (ne .Values.auth.oidc.clientSecretExistingSecret "") | quote }}
            - name: RADAR_HUB_OIDC_CALLBACK_URL
              {{- /* Auto-derive from publicURL when not set. Customers
                     who terminate TLS at a separate ingress with a
                     different host can still override this explicitly. */}}
              value: {{ default (printf "%s/api/auth/oidc/callback" .Values.hub.publicURL) .Values.auth.oidc.callbackURL | quote }}
            - name: RADAR_HUB_OIDC_DEFAULT_ROLE
              value: {{ .Values.auth.oidc.defaultRole | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.hub.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.hub.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.hub.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.hub.readinessProbe.periodSeconds }}
          resources:
            {{- toYaml .Values.hub.resources | nindent 12 }}
          {{- if or .Values.license.key .Values.license.existingSecret }}
          volumeMounts:
            - name: license
              mountPath: /etc/radar-hub
              readOnly: true
          {{- end }}
      {{- if or .Values.license.key .Values.license.existingSecret }}
      volumes:
        - name: license
          secret:
            {{- /* The chart's own Secret stores it under license-key; an
                   existingSecret uses `license`, which is the key name
                   documented for customers. Both are projected to the same
                   filename, so the hub reads one path either way. */}}
            secretName: {{ default (include "radar-hub.secretName" .) .Values.license.existingSecret | quote }}
            items:
              - key: {{ ternary "license" "license-key" (ne .Values.license.existingSecret "") | quote }}
                path: license
      {{- end }}
      {{- with .Values.hub.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hub.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hub.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
