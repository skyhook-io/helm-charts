{{- if .Values.ingress.enabled -}}
{{- if .Values.httproute.enabled -}}
{{- fail "Enable only ONE of ingress.enabled or httproute.enabled, not both." -}}
{{- end -}}
{{- if not .Values.ingress.hosts -}}
{{- fail "ingress.enabled=true requires at least one entry under ingress.hosts (each with a host + paths)." -}}
{{- end -}}
{{- range .Values.ingress.tls }}
{{- if not .secretName -}}
{{- /* required() rather than silent skip: a tls entry without secretName used
       to drop TLS and serve plain HTTP — a security regression. */}}
{{- fail "each ingress.tls[] entry requires a secretName." -}}
{{- end -}}
{{- end -}}
{{/*
Ingress for the hub. Public traffic terminates on the web Service; its nginx
routes /api + /agent + /mcp to the hub Service in-cluster, so every path
forwards to the web Service. Customers splitting origins (api. + app.) can
disable this and write their own.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "radar-hub.fullname" . }}
  labels:
    {{- include "radar-hub.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "radar-hub.webName" $ }}
                port:
                  number: {{ $.Values.service.web.port }}
          {{- end }}
    {{- end }}
{{- end }}
