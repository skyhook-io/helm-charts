name: Release Charts

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # chart-releaser packages only charts changed since the last tag into
      # .cr-release-packages/ and leaves them there. Mirror those same packages
      # to the GHCR OCI registry so enterprise catalogs (NKP, Rancher, Argo/Flux)
      # can pull via oci://ghcr.io/skyhook-io/charts/<name>. The HTTP repo
      # (gh-pages index.yaml) and Artifact Hub keep working unchanged.
      - name: Push charts to GHCR (OCI)
        if: hashFiles('.cr-release-packages/*.tgz') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GITHUB_TOKEN}" | helm registry login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

          for pkg in .cr-release-packages/*.tgz; do
            name="$(helm show chart "$pkg" | awk '/^name:/ {print $2; exit}')"
            ver="$(helm show chart "$pkg" | awk '/^version:/ {print $2; exit}')"

            # Chart versions are immutable. If this name+version is already in the
            # registry, skip rather than overwrite the digest — pushing a new digest
            # for an existing version breaks anyone pinning by digest.
            if helm show chart "oci://ghcr.io/skyhook-io/charts/${name}" --version "${ver}" >/dev/null 2>&1; then
              echo "::notice::${name}-${ver} already in GHCR OCI, skipping"
              continue
            fi

            echo "Pushing ${name}-${ver} to oci://ghcr.io/skyhook-io/charts"
            helm push "${pkg}" oci://ghcr.io/skyhook-io/charts
          done
