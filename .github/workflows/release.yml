name: Release Charts

on:
  push:
    branches:
      - main

# Serialise chart publishing. chart-releaser creates a git tag and a GitHub
# Release per new chart version; two runs overlapping on the same commit race,
# and the loser dies on `422 Validation Failed [tag_name already_exists]` — which
# has already happened (runs 31591099966 / 31591103039, same sha, 3s apart).
# cancel-in-progress stays false: a cancelled run can leave a chart packaged and
# tagged but not indexed, which is worse than a queued one.
concurrency:
  group: release-charts
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v3.14.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Run chart-releaser
        id: cr
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          skip_existing: true
          skip_upload: true # Defer the index until local packages match release assets.
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Index published chart archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/index-published-charts.sh

      # Label prerelease chart versions as prereleases on GitHub.
      #
      # Helm already hides a prerelease (1.7.0-rc.1) from `helm install` unless
      # --devel is passed, so it cannot reach anyone by the normal path. GitHub
      # has no such rule: chart-releaser creates an ordinary release and marks
      # it latest, so an rc would sit at the top of the releases page looking
      # shipped. chart-releaser v1.7.0 cannot express this itself - its only
      # related option is the run-wide --make-release-latest - so the labelling
      # happens here, after the fact.
      #
      # Driven off the packaged charts rather than off Chart.yaml: these are
      # exactly the charts chart-releaser just released, and `helm show chart`
      # normalises the version, so a quoted `version: "1.7.0-rc.1"` cannot
      # produce a value that silently fails to match its own tag.
      #
      # Marking a release as a prerelease makes GitHub keep the Latest badge on
      # the newest stable release instead, which is the behaviour we want and
      # is why no run-wide badge suppression is needed.
      - name: Label prerelease charts on GitHub
        if: steps.cr.outputs.changed_charts != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in .cr-release-packages/*.tgz; do
            [ -f "$pkg" ] || continue
            name="$(helm show chart "$pkg" | awk '/^name:/ {print $2; exit}')"
            ver="$(helm show chart "$pkg" | awk '/^version:/ {print $2; exit}')"
            case "$ver" in
              *-*) ;;                 # prerelease: 1.7.0-rc.1
              *)   continue ;;        # stable: leave it exactly as released
            esac
            echo "::notice::Marking ${name}-${ver} as a prerelease (staged, not shipped)"
            gh release edit "${name}-${ver}" --prerelease --latest=false
          done

      # Recover the published release archives even when a retry has no local
      # packages or changed_charts output. Existing Radar and Hub digests still need signing.
      - name: Mirror charts to OCI and sign Radar and Radar Hub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-oci.sh
