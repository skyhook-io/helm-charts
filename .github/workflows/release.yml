name: Release Charts

on:
  push:
    branches:
      - main

# Serialise chart publishing. chart-releaser creates a git tag and a GitHub
# Release per new chart version; two runs overlapping on the same commit race,
# and the loser dies on `422 Validation Failed [tag_name already_exists]` — which
# has already happened (runs 31591099966 / 31591103039, same sha, 3s apart).
# cancel-in-progress stays false: a cancelled run can leave a chart packaged and
# tagged but not indexed, which is worse than a queued one.
concurrency:
  group: release-charts
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      # Decide whether this run may claim GitHub's "Latest" badge. A prerelease
      # (e.g. 1.7.0-rc.1) must not: Helm already hides prereleases from
      # `helm install` unless --devel is passed, but the Latest badge is the
      # first thing a human sees on the releases page, so an unbadged
      # prerelease is the difference between "shipped" and "staged".
      #
      # chart-releaser publishes every chart whose <name>-<version> tag is
      # missing, so the same rule decides what is pending here.
      #
      # The badge is withheld whenever ANY pending chart is a prerelease, not
      # merely when all of them are. mark_as_latest is a single option for the
      # whole run and chart-releaser applies it to every release it creates,
      # so on a mixed run the badge would land on whichever release is created
      # last - possibly the prerelease, which is the exact outcome this is
      # meant to prevent. Erring this way costs a stable release its badge on
      # a mixed run; erring the other way ships an rc as Latest. It also makes
      # the scan's breadth harmless: a chart left untagged by an earlier failed
      # release can only ever withhold the badge, never wrongly grant it.
      - name: Decide whether this run claims the Latest badge
        id: latest
        run: |
          pending_prerelease=0
          for f in charts/*/Chart.yaml; do
            [ -f "$f" ] || continue
            name=$(awk '/^name:/ {print $2; exit}' "$f")
            ver=$(awk '/^version:/ {print $2; exit}' "$f")
            if git rev-parse -q --verify "refs/tags/${name}-${ver}" >/dev/null; then
              continue   # already released
            fi
            case "$ver" in
              *-*) echo "pending prerelease: ${name}-${ver}"; pending_prerelease=1 ;;
              *)   echo "pending stable: ${name}-${ver}" ;;
            esac
          done
          if [ "$pending_prerelease" = 1 ]; then
            echo "A prerelease is pending - withholding the Latest badge for this run."
            echo "mark=false" >> "$GITHUB_OUTPUT"
          else
            echo "mark=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-releaser
        id: cr
        uses: helm/chart-releaser-action@v1.7.0
        with:
          mark_as_latest: ${{ steps.latest.outputs.mark }}
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # Mirror the charts chart-releaser just packaged (.cr-release-packages/)
      # to the GHCR OCI registry, alongside the HTTP repo (gh-pages) and
      # Artifact Hub, so catalogs that consume charts over OCI can pull
      # oci://ghcr.io/skyhook-io/charts/<name>. Gated on chart-releaser's own
      # changed_charts output so it only runs when a chart was actually released.
      - name: Push charts to GHCR (OCI)
        if: steps.cr.outputs.changed_charts != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GITHUB_TOKEN}" | helm registry login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

          for pkg in .cr-release-packages/*.tgz; do
            name="$(helm show chart "$pkg" | awk '/^name:/ {print $2; exit}')"
            ver="$(helm show chart "$pkg" | awk '/^version:/ {print $2; exit}')"

            # Chart versions are immutable. If this name+version is already in the
            # registry, skip rather than overwrite the digest — pushing a new digest
            # for an existing version breaks anyone pinning by digest.
            if helm show chart "oci://ghcr.io/skyhook-io/charts/${name}" --version "${ver}" >/dev/null 2>&1; then
              echo "::notice::${name}-${ver} already in GHCR OCI, skipping"
              continue
            fi

            echo "Pushing ${name}-${ver} to oci://ghcr.io/skyhook-io/charts"
            helm push "${pkg}" oci://ghcr.io/skyhook-io/charts
          done
